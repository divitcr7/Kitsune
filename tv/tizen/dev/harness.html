<!doctype html>
<!--
  Offline harness for the TizenBrew module: open in desktop Chrome at 1920x1080 (or let shoot.sh
  screenshot it). Query params:
    mode=ui|player|login   which part of Kitsune to start (default ui)
    seed=1                 pre-fill Continue Watching, My List and history
    keys=down,right:400    remote presses to replay (name[:delay ms]); names: left right up down ok back playpause
  The hash picks the screen in ui mode, e.g. harness.html?seed=1#/show/s3
-->
<html>
<head>
<meta charset="utf-8">
<title>Kitsune TV harness</title>
<style>html,body{margin:0;background:#000}.site{color:#888;font:20px Arial;padding:20px}</style>
<script src="fixtures.js"></script>
<script>
(function () {
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) { if (kv) { var p = kv.split('='); q[p[0]] = decodeURIComponent(p[1] || ''); } });
  var mode = q.mode || 'ui';
  window.__kitsuneDev = { mode: mode, episode: { id: 's3e4', slug: 'episode-4' } };

  try { sessionStorage.clear(); localStorage.clear(); } catch (e) {}
  if (q.seed) {
    var F = window.__FIXTURES, now = Date.now(), history = {}, progress = {};
    [2, 7, 11, 16].forEach(function (i, n) {
      var s = F.shows[i], ep = { id: s.id + 'e' + (n + 3), slug: 'episode-' + (n + 3), number: n + 3, title: 'Storm Season', duration: 1420, image: { resized: { '640x360': '/episode/' + s.id + 'e' + (n + 3) + '/640x360.jpg' } } };
      history[s.id] = { show: { id: s.id, slug: s.slug, name: s.name, poster: s.poster, background: s.background }, episode: ep, at: now - n * 3600e3 };
      progress[ep.id] = { t: 300 + n * 260, d: 1420, at: now - n * 3600e3 };
    });
    var list = [4, 9, 13, 20, 22, 25, 27].map(function (i) { var s = F.shows[i]; return { id: s.id, slug: s.slug, name: s.name, poster: s.poster }; });
    localStorage.setItem('kitsune:store', JSON.stringify({ state: { myList: list, history: history, progress: progress, signedIn: false }, version: 1 }));
  }
  if (mode === 'player') {
    sessionStorage.setItem('kitsune:playing', JSON.stringify({ show: { id: 's3', slug: 'the-quiet-ronin', name: 'The Quiet Ronin' }, episode: { id: 's3e4', slug: 'episode-4', number: 4, title: 'Under the Lanterns', duration: 1420 } }));
  }

  // The API, answered from fixtures.
  window.fetch = function (input) {
    var url = typeof input === 'string' ? input : input.url;
    var r = window.__FIXTURES.route(url);
    return new Promise(function (resolve) {
      setTimeout(function () { resolve(new Response(JSON.stringify(r.body), { status: r.status || 200, headers: { 'Content-Type': 'application/json' } })); }, 30);
    });
  };

  // CDN artwork, drawn locally: a gradient per show, with its name on posters and logos.
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function art(url) {
    var m = url.match(/anime\.delivery\/(\w+)\/([^/]+)\/(\d+)x(\d+|large)/) || url.match(/anime\.delivery\/(\w+)\/([^/]+)\/(\w+)/);
    if (!m) return url;
    var kind = m[1], id = m[2], showId = id.replace(/e\d+$/, ''), show = window.__FIXTURES.byId[showId] || { name: '' };
    var h = hue(id), w = kind === 'poster' ? 480 : kind === 'logo' ? 900 : 1920, ht = kind === 'poster' ? 720 : kind === 'logo' ? 260 : 1080;
    var svg;
    if (kind === 'logo') {
      svg = '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260"><text x="4" y="190" textLength="880" lengthAdjust="spacingAndGlyphs" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="96" fill="#fff" stroke="hsl(' + h + ',80%,60%)" stroke-width="3">' + show.name.replace(/&/g, '&amp;') + '</text></svg>';
    } else {
      svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + ht + '" viewBox="0 0 ' + w + ' ' + ht + '">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(' + h + ',62%,52%)"/><stop offset="1" stop-color="hsl(' + ((h + 70) % 360) + ',55%,12%)"/></linearGradient></defs>' +
        '<rect width="100%" height="100%" fill="url(#g)"/>' +
        '<circle cx="' + w * 0.72 + '" cy="' + ht * 0.35 + '" r="' + ht * 0.28 + '" fill="hsl(' + ((h + 30) % 360) + ',80%,75%)" fill-opacity="0.35"/>' +
        '<circle cx="' + w * 0.82 + '" cy="' + ht * 0.62 + '" r="' + ht * 0.16 + '" fill="#fff" fill-opacity="0.12"/>' +
        (kind === 'poster' ? '<text x="28" y="660" font-family="Arial" font-weight="800" font-size="42" fill="#fff">' + show.name.replace(/&/g, '&amp;') + '</text>' : '') +
        (kind === 'episode' ? '<text x="40" y="' + (ht - 40) + '" font-family="Arial" font-weight="700" font-size="' + ht * 0.09 + '" fill="#fff" fill-opacity="0.6">' + id + '</text>' : '') +
        '</svg>';
    }
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  Object.defineProperty(HTMLImageElement.prototype, 'src', { configurable: true, get: d.get, set: function (v) { d.set.call(this, /anime\.delivery/.test(v) ? art(v) : v); } });

  // ?debug=1: show what has focus and how far the page and rails are scrolled.
  if (q.debug) setInterval(function () {
    var box = document.getElementById('dbg');
    if (!box) { box = document.createElement('div'); box.id = 'dbg'; box.setAttribute('data-kitsune-keep', ''); box.setAttribute('style', 'position:fixed;right:10px;bottom:10px;z-index:2147483647;background:#ff0;color:#000;font:16px monospace;padding:6px 10px;white-space:pre'); document.body.appendChild(box); }
    var rn = window.ReactNativeWebView;
    if (rn && !rn.__traced) {
      var orig = rn.postMessage; window.__msgs = [];
      rn.postMessage = function (d) { window.__msgs.push(String(d).slice(0, 120)); if (window.__msgs.length > 6) window.__msgs.shift(); return orig.call(rn, d); };
      rn.__traced = true;
    }
    var f = document.querySelector('.f'), page = document.querySelector('[data-page]');
    var tr = f && f.closest('[data-track]');
    box.textContent = 'focus ' + (f ? f.getAttribute('data-k') : '-') + '\npage ' + (page ? page.style.transform : '-') + '\ntrack ' + (tr ? tr.style.transform : '-') + '\n' + (window.__msgs || []).join('\n');
  }, 100);

  // ?still=1: no transitions or animations, so headless screenshots show where things end up
  // (headless virtual time doesn't advance compositor transitions).
  if (q.still) setInterval(function () {
    if (document.getElementById('still')) return;
    var st = document.createElement('style');
    st.id = 'still';
    st.textContent = '*,*:before,*:after{transition:none!important;-webkit-animation:none!important;animation:none!important}';
    (document.head || document.documentElement).appendChild(st);
  }, 20);

  // Remote presses.
  var CODES = { left: 37, up: 38, right: 39, down: 40, ok: 13, back: 27, playpause: 10252 };
  window.addEventListener('load', function () {
    var t = 1200;
    (q.keys || '').split(',').filter(Boolean).forEach(function (k) {
      var p = k.split(':');
      t += Number(p[1] || 350);
      setTimeout(function () {
        var e = document.createEvent('Event');
        e.initEvent('keydown', true, true);
        e.keyCode = CODES[p[0]];
        Object.defineProperty(e, 'keyCode', { get: function () { return CODES[p[0]]; } });
        (document.activeElement || document.body).dispatchEvent(e);
      }, t);
    });
  });

  // Player mode: a fake site page with a "playing" video the shared script will find and pin.
  if (mode === 'player') {
    document.addEventListener('DOMContentLoaded', function () {
      var v = document.querySelector('video'), paused = false, time = 754;
      Object.defineProperty(v, 'duration', { get: function () { return 1420; } });
      Object.defineProperty(v, 'readyState', { get: function () { return 4; } });
      Object.defineProperty(v, 'paused', { get: function () { return paused; } });
      Object.defineProperty(v, 'currentTime', { get: function () { return time; }, set: function (x) { time = x; } });
      v.play = function () { paused = false; return Promise.resolve(); };
      v.pause = function () { paused = true; };
      // A video.js-style player on the element, so the shared script reports audio and subtitle tracks.
      function list(a) { a.forEach(function (t, i) { a[i] = t; }); return a; }
      var audio = list([{ label: 'Japanese', language: 'ja', enabled: true }, { label: 'English', language: 'en', enabled: false }]);
      var subs = list([{ kind: 'subtitles', label: 'English', mode: 'showing' }, { kind: 'subtitles', label: 'Español', mode: 'disabled' }]);
      v.player = { audioTracks: function () { return audio; }, textTracks: function () { return subs; } };
      // Headless Chrome doesn't always run the page's animation frames; nudge 'ready' so the OSD shows.
      setTimeout(function () { var rn = window.ReactNativeWebView; if (rn) rn.postMessage(JSON.stringify({ type: 'ready' })); }, 600);
    });
  }
})();
</script>
</head>
<body>
  <div class="site">anime.nexus (stand-in page)</div>
  <div class="videojs-player" style="width:960px;height:540px;margin:40px;background:linear-gradient(135deg,#334,#112)">
    <div class="video-js" style="width:100%;height:100%"><video style="width:100%;height:100%"></video></div>
  </div>
  <script src="../dist/kitsune.js"></script>
</body>
</html>
