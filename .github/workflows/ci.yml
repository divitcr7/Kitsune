name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck + player script parse
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Samsung TV module (ES5 build)
        run: npm run build:tizen
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-tizen
          path: tv/tizen/dist/kitsune.js
