name: Test build

# Builds an APK from a branch and publishes it as a pre-release, so a change can be tried on a phone
# or TV without a computer. The build is a separate app ("Kitsune Test": its own package name, signed
# with the debug key), so it installs next to the released Kitsune and never replaces it or touches
# its list and history. Installed apps only look at the latest full release, so they are never
# offered a test build.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Make it a separate app
        run: |
          node -e '
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.name = "Kitsune Test";
          app.expo.scheme = "kitsunetest";
          app.expo.android.package = "app.kitsune.anime.test";
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '
      - name: Build the APK
        run: npm run build:apk
      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHA=${GITHUB_SHA::7}
          APK="Kitsune-Test-$VERSION-$SHA.apk"
          cp "dist/Kitsune-v$VERSION.apk" "$APK"
          cat > notes.md <<NOTES
          A test build of Kitsune from \`$GITHUB_REF_NAME\` at $SHA, not a release.

          It installs as a separate app called **Kitsune Test**, next to the Kitsune you already have. Your list and history in Kitsune are not touched, and Kitsune Test starts empty and signed out. Uninstall it when you are done.

          Download \`$APK\` below on the phone or TV and open it to install.
          NOTES
          gh release create "test-$SHA" "$APK" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Kitsune Test $VERSION ($SHA)" --notes-file notes.md
